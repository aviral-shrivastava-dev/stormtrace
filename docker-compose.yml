# StormTrace local lakehouse, event streaming, and monitoring.
#
#   docker compose up -d
#
# MinIO server:    http://127.0.0.1:9000
# MinIO console:   http://127.0.0.1:9001  (login minioadmin / minioadmin)
# Redpanda broker: localhost:9092  (Kafka API compatible)
# Prometheus:      http://127.0.0.1:9090
# Grafana:         http://127.0.0.1:3000  (anonymous read-only access)
#
# Prometheus scrapes the StormTrace API on the HOST; start it with:
#   python -m uvicorn src.api:app --port 8000
#
# Credentials are local-development defaults: never use them for anything
# reachable from the internet.

services:
  minio:
    image: minio/minio:latest
    container_name: stormtrace-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set stormtrace http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing stormtrace/stormtrace &&
      echo 'stormtrace bucket ready'
      "

  # Kafka-compatible single-node broker for pipeline events. dev-container
  # mode trades durability guarantees for a tiny footprint: exactly right
  # for a laptop demo, exactly wrong for production data.
  #
  # Kafka brokers advertise the address clients should RECONNECT to, so a
  # host-machine client and container clients need different listeners:
  # internal://redpanda:9092 for containers, external://localhost:9092 for
  # the host Python client (host port 9092 maps to container port 29092).
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: stormtrace-redpanda
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9092
    ports:
      - "9092:29092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:'"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Scrapes the StormTrace API's /metrics endpoint on the host every 30s.
  prometheus:
    image: prom/prometheus:latest
    container_name: stormtrace-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Docker Desktop resolves host.docker.internal already; the explicit
      # mapping keeps the setup working on other Docker engines too.
      - "host.docker.internal:host-gateway"

  # Dashboards as code: datasource and dashboard are provisioned from
  # ./monitoring/grafana, so the research board appears without clicks.
  grafana:
    image: grafana/grafana:latest
    container_name: stormtrace-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/stormtrace.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  minio-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
