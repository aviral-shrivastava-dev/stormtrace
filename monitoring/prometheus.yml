# Prometheus scrape configuration for StormTrace.
# The API runs on the HOST (python -m uvicorn src.api:app --port 8000),
# so containers reach it via host.docker.internal, which Docker Desktop
# resolves to the host machine.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: stormtrace-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: stormtrace
