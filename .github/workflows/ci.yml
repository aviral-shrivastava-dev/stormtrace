name: CI

# Checks for every push and pull request. These checks intentionally
# never contact CelesTrak, NOAA, or SatNOGS: CI runners must not make data
# source requests, and public usage policies must be respected from any
# machine. Every test builds its own in-memory DuckDB fixtures instead.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check src tests

      - name: Compile all Python sources
        run: python -m compileall -q src tests

      - name: Verify SQL files are present and non-empty
        shell: python
        run: |
          import sys
          from pathlib import Path

          sql_files = sorted(Path("sql").glob("*.sql"))
          if not sql_files:
              print("No SQL files found", file=sys.stderr)
              sys.exit(1)
          for path in sql_files:
              size = path.stat().st_size
              if size == 0:
                  print(f"SQL file is empty: {path}", file=sys.stderr)
                  sys.exit(1)
              print(f"OK {path} ({size} bytes)")

      - name: Verify imports resolve without network access
        run: |
          python -c "import duckdb, matplotlib, sgp4, fastapi, uvicorn, boto3; \
            import confluent_kafka, sklearn, scipy, numpy, mlflow, prometheus_client; \
            print('dependencies import cleanly')"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify every source module imports cleanly
        run: |
          python -c "import sys, pathlib, importlib; sys.path.insert(0, 'src'); \
            [importlib.import_module(p.stem) for p in sorted(pathlib.Path('src').glob('*.py'))]; \
            print('all source modules import cleanly')"

